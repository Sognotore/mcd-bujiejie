<!doctype html>
<html lang="zh-CN" data-runtime="public-demo"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#fff9ee"><meta name="description" content="选个预算，或直接跳过。随机搭一顿主食、小食和饮品，今天吃什么交给这一抽。"><title>麦麦不纠结 · 今天吃什么，交给这一抽</title><link rel="stylesheet" href="./styles.css?v=8448e597e175"><script type="module" src="./app.mjs?v=8448e597e175"></script></head>
<body><div class="page-shell">
<header class="site-header"><a class="brand" href="./" aria-label="麦麦不纠结首页"><span class="brand-mark" aria-hidden="true">↝</span><span>麦麦不纠结<small>让选择轻松一点</small></span></a><div class="mode-switch" role="group" aria-label="数据模式"><button type="button" data-mode="demo" aria-pressed="true">体验演示</button><button type="button" data-mode="live" aria-pressed="false"><span class="live-dot" aria-hidden="true"></span>实时菜单</button></div></header>
<main class="main-grid"><section class="decision" aria-labelledby="hero-title"><div class="intro"><span class="eyebrow"><span class="tiny-dice" aria-hidden="true">⚄</span> 今天少纠结一件事</span><h1 id="hero-title">今天吃什么？<br><span>交给这一抽。</span></h1><p class="lead">预算你定，吃什么交给它。<br>不做选择题，只给你一顿搭配。</p></div>
<section id="live-panel" class="live-panel" aria-label="选择取餐门店" hidden><div class="panel-label"><strong>先选一家门店</strong><span>到店取餐</span></div><p id="connection-note" class="muted"></p><form id="store-form"><div class="location-inputs"><label><span>城市</span><input id="city" name="city" placeholder="例如：上海" autocomplete="address-level2" maxlength="60" required></label><label><span>附近位置</span><input id="keyword" name="keyword" placeholder="地标或路名" maxlength="120" required></label></div><button class="store-search" type="submit">查找门店 <span aria-hidden="true">→</span></button></form><label id="store-label" hidden><span class="field-title">选择取餐门店</span><select id="store-select" aria-label="选择取餐门店"></select></label><p id="selected-store" class="muted"></p></section>
<div class="budget-area"><div class="panel-label"><h2 id="budget-title" tabindex="-1">这顿，想花多少？</h2><span>可跳过</span></div><div class="budget-presets" role="group" aria-label="快捷预算"><button type="button" data-budget="20" aria-label="预算 20 元" aria-pressed="false"><small>¥</small>20</button><button type="button" data-budget="30" aria-label="预算 30 元" aria-pressed="false"><small>¥</small>30</button><button type="button" data-budget="40" aria-label="预算 40 元" aria-pressed="false"><small>¥</small>40</button><button type="button" data-budget="50" aria-label="预算 50 元" aria-pressed="false"><small>¥</small>50</button></div><div class="other-budget"><label class="custom-budget"><span aria-hidden="true">¥</span><input id="custom-budget" aria-label="自定义预算" aria-describedby="error" inputmode="decimal" autocomplete="off" placeholder="自己定个数" maxlength="16"><span class="unit">以内</span></label><button type="button" id="skip-budget" aria-pressed="false">跳过预算 <span aria-hidden="true">↗</span></button></div></div>
<div id="setup-actions"><div id="action-area" class="action-area"><p id="budget-summary" class="budget-summary">不限预算 · 一人餐</p><button id="draw" class="draw-button" type="button"><span id="draw-icon" aria-hidden="true">⚄</span><span id="draw-label">帮我搭一餐</span><span class="action-arrow" aria-hidden="true">→</span></button><p id="error" class="error" role="alert" hidden></p><p id="message" class="message" role="status" hidden></p><p id="lock-note" class="muted" hidden></p><p class="composition"><span>一份主食</span><i>＋</i><span>一份小食</span><i>＋</i><span>一杯饮品</span></p></div></div></section>
<section class="meal-stage" aria-label="随机搭配结果"><div id="empty" class="empty-state"><span class="stage-label">把“随便”变成一顿饭</span><div id="tray-art" aria-hidden="true"></div><div class="empty-copy"><span class="little-star" aria-hidden="true">✳</span><h2>不用想了，抽一份。</h2><p>选好预算，按下按钮。<br>主食、小食和饮品，我们一起搭。</p></div><span class="stage-bottom">一人食 · 刚刚好</span></div>
<div id="result" class="result" hidden><div class="receipt-top"><span id="source-badge" class="source-badge">演示搭配</span><span class="receipt-icon" aria-hidden="true">✳</span></div><h2 id="result-title" tabindex="-1">这顿，就吃这些。</h2><p id="meal-name" class="meal-name"></p><div id="meal-items" class="meal-items"></div><div class="receipt-total"><div><span id="total-label">演示合计</span><small id="price-note">演示价格，不代表实际售价</small></div><strong id="total" data-cents="0"></strong></div><p id="quote-status" class="quote-status"></p><div id="result-actions"></div><div class="result-secondary-actions"><button id="edit-budget" class="copy-button" type="button">修改预算 <span aria-hidden="true">↶</span></button><button id="copy" class="copy-button" type="button">复制清单 <span aria-hidden="true">↗</span></button></div><p id="copy-status" class="muted" role="status"></p><div id="copy-fallback" hidden><label for="copy-text">未能自动复制，可以手动复制：</label><textarea id="copy-text" readonly rows="7"></textarea></div></div></section></main>
<footer class="site-footer"><span><span class="footer-dot" aria-hidden="true"></span><span id="mode-note">当前为演示模式，餐品和价格仅供体验。</span></span><p>独立开发的参赛作品，非麦当劳官方产品。实时餐品与价格以官方渠道为准。</p></footer></div></body></html>
